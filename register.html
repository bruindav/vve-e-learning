<!-- fix 45 -->
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registreren / inloggen — E-learning VvE-bestuur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#132228; --ink-navy-deep:#0d1a1f; --paper:#ECE4D1; --rule-soft:#2F4F4433;
    --ink-text:#2A2118; --ink-fade:#5A5040; --amber:#C98A2C; --amber-deep:#a86f1c; --debit:#a13d2c; --credit:#3d6b52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(ellipse at 30% -10%, #1c343c 0%, transparent 55%), var(--ink-navy);
    font-family:'IBM Plex Sans', sans-serif;
  }
  .box{
    max-width:420px; width:100%; background:var(--paper); border-radius:4px; padding:36px 32px;
    box-shadow:0 20px 50px -20px #000000a0;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--amber-deep); margin-bottom:14px; text-align:center;
  }
  h1{font-family:'Fraunces',serif; font-size:24px; color:var(--ink-text); margin:0 0 10px; text-align:center;}
  p.sub{font-size:13.5px; color:var(--ink-fade); line-height:1.5; margin:0 0 22px; text-align:center;}

  .tabs{display:flex; gap:6px; margin-bottom:22px; background:#00000009; padding:4px; border-radius:4px;}
  .tab{flex:1; text-align:center; padding:9px; font-size:13px; font-weight:600; border-radius:3px; cursor:pointer; color:var(--ink-fade);}
  .tab.active{background:var(--paper); color:var(--ink-text); box-shadow:0 1px 3px #00000020;}

  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-text); margin-bottom:6px;}
  input{
    width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid var(--rule-soft); border-radius:3px;
    font-size:14px; margin-bottom:16px; font-family:'IBM Plex Sans',sans-serif;
  }
  button{
    width:100%; padding:12px; border:none; border-radius:3px; background:var(--amber);
    color:var(--ink-navy-deep); font-weight:600; font-size:14.5px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;
  }
  button:hover{background:#e0a94b;}
  button:disabled{opacity:.6; cursor:default;}
  .msg{margin-top:16px; font-size:13px; padding:12px 14px; border-radius:3px; display:none;}
  .msg.show{display:block;}
  .msg.ok{background:#3d6b521a; border:1px solid #3d6b5233; color:#264936;}
  .msg.error{background:#a13d2c1a; border:1px solid #a13d2c33; color:#7a2c1f;}
  .back{display:block; text-align:center; margin-top:20px; font-size:12.5px; color:var(--ink-fade); text-decoration:none;}
  .back:hover{color:var(--ink-text);}
  .signed-in{text-align:center;}
  .signed-in a.btn{
    display:inline-block; margin-top:16px; padding:11px 20px; background:var(--amber); color:var(--ink-navy-deep);
    font-weight:600; border-radius:3px; text-decoration:none; font-size:14px;
  }
  .pending-badge{
    display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    font-weight:600; color:var(--ink-fade); background:#00000009; border:1px solid var(--rule-soft);
    padding:5px 12px; border-radius:2px; margin-bottom:14px;
  }
  form{display:none;}
  form.active{display:block;}
</style>
</head>
<body>

<div class="box" id="box">
  <div class="eyebrow">Digidave &middot; E-learning VvE-bestuur</div>
  <h1>Welkom</h1>
  <p class="sub">Registreer jullie VvE, of log in als jullie al een account hebben.</p>

  <div class="tabs">
    <div class="tab" id="tabRegister">Registreren</div>
    <div class="tab active" id="tabLogin">Inloggen</div>
  </div>

  <form id="registerForm">
    <label for="regNaam">Naam van de VvE</label>
    <input type="text" id="regNaam" placeholder="bijv. VVE Fazantenkamp" autocomplete="organization" required>
    <label for="regEmail">E-mailadres</label>
    <input type="email" id="regEmail" placeholder="bestuur@voorbeeld.nl" autocomplete="email" required>
    <label for="regPassword">Wachtwoord (minimaal 6 tekens)</label>
    <input type="password" id="regPassword" autocomplete="new-password" minlength="6" required>
    <button type="submit" id="registerBtn">Registreren</button>
  </form>

  <form id="loginForm" class="active">
    <label for="loginEmail">E-mailadres</label>
    <input type="email" id="loginEmail" autocomplete="email" required>
    <label for="loginPassword">Wachtwoord</label>
    <input type="password" id="loginPassword" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Inloggen</button>
    <a href="#" id="forgotLink" style="display:block; text-align:center; margin-top:12px; font-size:12.5px; color:var(--ink-fade); text-decoration:none;">Wachtwoord vergeten?</a>
  </form>

  <div class="msg" id="msg"></div>

  <a class="back" href="index.html">&larr; Terug naar overzicht</a>
  <p style="text-align:center; margin-top:10px; font-size:11.5px; color:var(--ink-fade);">
    <a href="privacy.html" style="color:var(--ink-fade);">Privacybeleid</a> &middot; <a href="disclaimer.html" style="color:var(--ink-fade);">Disclaimer</a>
  </p>
</div>

<script type="module">
  import { registerVve, loginVve, resetPasswordVve, watchAuth, getVveDocForCurrentUser, logout } from './assets/vve-auth.js?v45';

  const box = document.getElementById('box');
  const tabRegister = document.getElementById('tabRegister');
  const tabLogin = document.getElementById('tabLogin');
  const registerForm = document.getElementById('registerForm');
  const loginForm = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const registerBtn = document.getElementById('registerBtn');
  const loginBtn = document.getElementById('loginBtn');

  tabRegister.addEventListener('click', function(){
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    registerForm.classList.add('active'); loginForm.classList.remove('active');
    msg.classList.remove('show');
  });
  tabLogin.addEventListener('click', function(){
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    loginForm.classList.add('active'); registerForm.classList.remove('active');
    msg.classList.remove('show');
  });

  function showMsg(text, kind){
    msg.textContent = text;
    msg.className = 'msg show ' + kind;
  }

  async function renderSignedIn(user){
    var vve = await getVveDocForCurrentUser();
    var params = new URLSearchParams(window.location.search);
    var moduleSlug = params.get('module');

    if (!vve || vve.status !== 'approved') {
      box.innerHTML =
        '<div class="eyebrow">Digidave &middot; E-learning VvE-bestuur</div>' +
        '<div class="signed-in">' +
        '<div class="pending-badge">&#9203; In afwachting</div>' +
        '<h1>Nog niet goedgekeurd</h1>' +
        '<p class="sub">Ingelogd als ' + user.email + '. Jullie aanvraag wordt nog bekeken \u2014 je ontvangt een bevestigingsmail zodra dit is goedgekeurd.</p>' +
        '<a class="back" href="#" id="logoutLink">Uitloggen</a>' +
        '</div>';
    } else {
      var moduleLink = moduleSlug ? 'modules/' + moduleSlug + '.html' : 'index.html';
      box.innerHTML =
        '<div class="eyebrow">Digidave &middot; E-learning VvE-bestuur</div>' +
        '<div class="signed-in">' +
        '<h1>Je bent ingelogd</h1>' +
        '<p class="sub">Ingelogd als ' + user.email + '</p>' +
        '<a class="btn" href="' + moduleLink + '">Ga verder</a>' +
        '<br><a class="back" href="#" id="logoutLink">Uitloggen</a>' +
        '</div>';
    }
    document.getElementById('logoutLink').addEventListener('click', function(e){
      e.preventDefault();
      logout().then(function(){ window.location.reload(); });
    });
  }

  watchAuth(function(user){
    if (user) renderSignedIn(user);
  });

  registerForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('regEmail').value;
    var password = document.getElementById('regPassword').value;
    var naam = document.getElementById('regNaam').value.trim();
    if (!naam) {
      showMsg('Vul de naam van de VvE in \u2014 dat hebben we nodig om de aanvraag te kunnen herkennen.', 'error');
      return;
    }
    registerBtn.disabled = true;
    registerBtn.textContent = 'Bezig...';
    try {
      await registerVve(email, password, naam);
      showMsg('Registratie gelukt! We hebben een bevestigingsmail gestuurd. Jullie aanvraag wordt nu bekeken \u2014 je krijgt bericht zodra deze is goedgekeurd.', 'ok');
    } catch (err) {
      var code = err && err.code;
      if (code === 'auth/email-already-in-use') {
        showMsg('Dit e-mailadres is al geregistreerd. Gebruik het tabblad "Inloggen" hierboven.', 'error');
      } else if (code === 'auth/weak-password') {
        showMsg('Kies een sterker wachtwoord (minimaal 6 tekens).', 'error');
      } else {
        showMsg('Registreren mislukt: ' + (err && err.message ? err.message : err), 'error');
      }
    } finally {
      registerBtn.disabled = false;
      registerBtn.textContent = 'Registreren';
    }
  });

  loginForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    loginBtn.disabled = true;
    loginBtn.textContent = 'Bezig...';
    try {
      await loginVve(email, password);
    } catch (err) {
      showMsg('Inloggen mislukt: ' + (err && err.message ? err.message : err), 'error');
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Inloggen';
    }
  });

  document.getElementById('forgotLink').addEventListener('click', async function(e){
    e.preventDefault();
    var email = document.getElementById('loginEmail').value;
    if (!email) {
      showMsg('Vul eerst je e-mailadres in bij het inlogformulier.', 'error');
      return;
    }
    try {
      await resetPasswordVve(email);
      showMsg('Er is een e-mail gestuurd naar ' + email + ' om je wachtwoord opnieuw in te stellen. Check ook je spam-map.', 'ok');
    } catch (err) {
      showMsg('Versturen mislukt: ' + (err && err.message ? err.message : err), 'error');
    }
  });
</script>

</body>
</html>
